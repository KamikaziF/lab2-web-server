<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Error ' + ${status}">Error</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .status {
            font-size: 5rem;
            font-weight: bold;
            color: #e63946;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #1d3557;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status" th:text="${status}">500</div>
        <h1 th:text="${error}">Error Interno</h1>

        <div class="info">
            <p><strong>Ruta:</strong> <span th:text="${path}">/ejemplo</span></p>
        </div>
    </div>

</body>
</html>
